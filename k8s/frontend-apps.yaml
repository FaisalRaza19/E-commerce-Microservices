# --- ADMIN APP ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
  namespace: microservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin
  template:
    metadata:
      labels:
        app: admin
    spec:
      imagePullSecrets:
        - name: ecr-secret
      containers:
        - name: admin
          image: 256056679502.dkr.ecr.eu-north-1.amazonaws.com/admin@sha256:2fdd79a219f8859def4dc7549ce6fd206bf55ee3cae9a3096167dbbeb8784988
          envFrom:
            - secretRef:
                name: app-secrets
          ports:
            - containerPort: 3001
          resources:
            requests: { memory: "150Mi", cpu: "200m" }
            limits: { memory: "300Mi", cpu: "800m" }
---
apiVersion: v1
kind: Service
metadata:
  name: admin
  namespace: microservices
spec:
  type: NodePort # FIX: NodePort for external access
  selector:
    app: admin
  ports:
    - protocol: TCP
      port: 3001 # Cluster Port
      targetPort: 3001
      nodePort: 30005

# --- CLIENT APP ---
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  namespace: microservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app: client
  template:
    metadata:
      labels:
        app: client
    spec:
      imagePullSecrets:
        - name: ecr-secret
      containers:
        - name: client
          image: 256056679502.dkr.ecr.eu-north-1.amazonaws.com/client@sha256:7d0e6f848f6084c3069151a96ff6d26fec1d212bfd641b3c51855339fbf79002
          envFrom:
            - secretRef:
                name: app-secrets
          ports:
            - containerPort: 3000
          resources:
            requests: { memory: "150Mi", cpu: "200m" }
            limits: { memory: "300Mi", cpu: "800m" }
---
apiVersion: v1
kind: Service
metadata:
  name: client
  namespace: microservices
spec:
  type: NodePort
  selector:
    app: client
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
      nodePort: 30004 # EXTERNAL ACCESS PORT
