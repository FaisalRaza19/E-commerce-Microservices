# --- ADMIN APP ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
  namespace: microservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin
  template:
    metadata:
      labels:
        app: admin
    spec:
      imagePullSecrets:
        - name: ecr-secret
      containers:
        - name: admin
          image: 256056679502.dkr.ecr.eu-north-1.amazonaws.com/admin@sha256:2e7145cd94812c06e28f9ba757076d961cc18d87ffffd289198fadd7231c7f4b
          envFrom:
            - secretRef:
                name: app-secrets
          env:
            # FIX: Point to Public IP + NodePorts
            - name: NEXT_PUBLIC_PRODUCT_SERVICE_URL
              value: "http://13.62.136.49:30000"
            - name: NEXT_PUBLIC_ORDER_SERVICE_URL
              value: "http://13.62.136.49:30001"
            - name: NEXT_PUBLIC_PAYMENT_SERVICE_URL
              value: "http://13.62.136.49:30002"
            - name: NEXT_PUBLIC_AUTH_SERVICE_URL
              value: "http://13.62.136.49:30003"
          ports:
            - containerPort: 3000
          resources:
            requests: { memory: "150Mi", cpu: "200m" }
            limits: { memory: "300Mi", cpu: "800m" }
---
apiVersion: v1
kind: Service
metadata:
  name: admin
  namespace: microservices
spec:
  type: NodePort # FIX: NodePort for external access
  selector:
    app: admin
  ports:
    - protocol: TCP
      port: 3001 # Cluster Port
      targetPort: 3001
      nodePort: 30005

# --- CLIENT APP ---
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  namespace: microservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app: client
  template:
    metadata:
      labels:
        app: client
    spec:
      imagePullSecrets:
        - name: ecr-secret
      containers:
        - name: client
          image: 256056679502.dkr.ecr.eu-north-1.amazonaws.com/client@sha256:fc63e576882bc095fde84ed30731b1e3fcf5604857069019911be51163a8bb5f
          envFrom:
            - secretRef:
                name: app-secrets
          env:
            # FIX: Point to Public IP + NodePorts
            - name: NEXT_PUBLIC_PRODUCT_SERVICE_URL
              value: "http://13.62.136.49:30000"
            - name: NEXT_PUBLIC_ORDER_SERVICE_URL
              value: "http://13.62.136.49:30001"
            - name: NEXT_PUBLIC_PAYMENT_SERVICE_URL
              value: "http://13.62.136.49:30002"
            - name: NEXT_PUBLIC_AUTH_SERVICE_URL
              value: "http://13.62.136.49:30003"
          ports:
            - containerPort: 3001
          resources:
            requests: { memory: "150Mi", cpu: "200m" }
