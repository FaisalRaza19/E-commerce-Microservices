  template:
    metadata:
      labels:
        app: email-service
    spec:
      imagePullSecrets:
        - name: ecr-secret
      containers:
        - name: email-service
          image: 256056679502.dkr.ecr.eu-north-1.amazonaws.com/email-service@sha256:b3ee256565d2256669842b3b2d765d1c65877576f7ae196fd360aa12abc8a2f3
