# --- PRODUCT SERVICE ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: microservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      imagePullSecrets:
        - name: ecr-secret
      containers:
        - name: product-service
          image: 256056679502.dkr.ecr.eu-north-1.amazonaws.com/product-service@sha256:5c76d31b17b94ab7596730101e7eec8fc562faf0a137136233c49ce3b2f21552
          env:
            - name: PORT   # FIX: Explicitly set the port for the Node app
              value: "3000"
          envFrom:
            - secretRef:
                name: app-secrets
          ports:
            - containerPort: 3000
          resources:
            requests: { memory: "80Mi", cpu: "50m" }
            limits: { memory: "180Mi", cpu: "400m" }
---
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: microservices
spec:
  type: NodePort      # FIX: Changed from LoadBalancer to NodePort
  selector:
    app: product-service
  ports:
    - protocol: TCP
      port: 8000      # Internal Cluster Port
      targetPort: 3000 # Container Port
      nodePort: 30000 # EXTERNAL ACCESS PORT (Must be 30000+)

