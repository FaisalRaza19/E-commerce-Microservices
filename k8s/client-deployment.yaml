apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  namespace: microservices
  labels:
    app: client
spec:
  replicas: 2
  selector:
    matchLabels:
      app: client
  template:
    metadata:
      labels:
        app: client
    spec:
      containers:
        - name: client
          image: 256056679502.dkr.ecr.eu-north-1.amazonaws.com/client@sha256:5489dbae4571d2b7025a5156c6631c0d1270f95af71a3caa4428ec711331a8d2
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
              valueFrom:
                secretKeyRef:
                  name: client-secret
                  key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
            - name: CLERK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: client-secret
                  key: CLERK_SECRET_KEY
            - name: NEXT_PUBLIC_CLERK_SIGN_IN_URL
              valueFrom:
                secretKeyRef:
                  name: client-secret
                  key: NEXT_PUBLIC_CLERK_SIGN_IN_URL
            - name: NEXT_PUBLIC_CLERK_SIGN_UP_URL
              valueFrom:
                secretKeyRef:
                  name: client-secret
                  key: NEXT_PUBLIC_CLERK_SIGN_UP_URL
            - name: NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL
              valueFrom:
                secretKeyRef:
                  name: client-secret
                  key: NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL
            - name: NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL
              valueFrom:
                secretKeyRef:
                  name: client-secret
                  key: NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL
            - name: NEXT_PUBLIC_PRODUCT_SERVICE_URL
              value: http://product-service:8000
            - name: NEXT_PUBLIC_ORDER_SERVICE_URL
              value: http://order-service:8001
            - name: NEXT_PUBLIC_PAYMENT_SERVICE_URL
              value: http://payment-service:8002
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: client
  namespace: microservices
spec:
  selector:
    app: client
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
  type: LoadBalancer
