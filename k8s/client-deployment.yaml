apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  namespace: microservices
  labels:
    app: client
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: client
  template:
    metadata:
      labels:
        app: client
    spec:
      containers:
        - name: client
          image: 256056679502.dkr.ecr.eu-north-1.amazonaws.com/client:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          env:
            - name: NODE_ENV
              value: "production"
            # Public NEXT_PUBLIC envs from next-app-secret
            - name: NEXT_PUBLIC_CLERK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: next-app-secret
                  key: CLERK_SECRET_KEY
            - name: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
              valueFrom:
                secretKeyRef:
                  name: next-app-secret
                  key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
            - name: NEXT_PUBLIC_CLERK_SIGN_IN_URL
              valueFrom:
                secretKeyRef:
                  name: next-app-secret
                  key: NEXT_PUBLIC_CLERK_SIGN_IN_URL
            - name: NEXT_PUBLIC_CLERK_SIGN_UP_URL
              valueFrom:
                secretKeyRef:
                  name: next-app-secret
                  key: NEXT_PUBLIC_CLERK_SIGN_UP_URL
            - name: NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL
              valueFrom:
                secretKeyRef:
                  name: next-app-secret
                  key: NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL
            - name: NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL
              valueFrom:
                secretKeyRef:
                  name: next-app-secret
                  key: NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL
            - name: NEXT_PUBLIC_PRODUCT_SERVICE_URL
              valueFrom:
                secretKeyRef:
                  name: next-app-secret
                  key: NEXT_PUBLIC_PRODUCT_SERVICE_URL
            - name: NEXT_PUBLIC_ORDER_SERVICE_URL
              valueFrom:
                secretKeyRef:
                  name: next-app-secret
                  key: NEXT_PUBLIC_ORDER_SERVICE_URL
            - name: NEXT_PUBLIC_PAYMENT_SERVICE_URL
              valueFrom:
                secretKeyRef:
                  name: next-app-secret
                  key: NEXT_PUBLIC_PAYMENT_SERVICE_URL

---
apiVersion: v1
kind: Service
metadata:
  name: client
  namespace: microservices
  labels:
    app: client
spec:
  type: ClusterIP
  selector:
    app: client
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
