# Admin (Next.js) Deployment + Service (production-ready)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
  namespace: microservices
  labels:
    app: admin
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: admin
  template:
    metadata:
      labels:
        app: admin
    spec:
      containers:
        - name: admin
          # production image from your ECR
          image: 256056679502.dkr.ecr.eu-north-1.amazonaws.com/admin:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /_next/static/development/healthz
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          env:
            # Public NEXT_PUBLIC envs — stored in next-app-secret
            - name: NEXT_PUBLIC_CLERK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: next-app-secret
                  key: NEXT_PUBLIC_CLERK_SECRET_KEY

            - name: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
              valueFrom:
                secretKeyRef:
                  name: next-app-secret
                  key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
            - name: NEXT_PUBLIC_CLERK_SIGN_IN_URL
              valueFrom:
                secretKeyRef:
                  name: next-app-secret
                  key: NEXT_PUBLIC_CLERK_SIGN_IN_URL
            - name: NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL
              valueFrom:
                secretKeyRef:
                  name: next-app-secret
                  key: NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL

            - name: NEXT_PUBLIC_PRODUCT_SERVICE_URL
              valueFrom:
                secretKeyRef:
                  name: next-app-secret
                  key: NEXT_PUBLIC_PRODUCT_SERVICE_URL
            - name: NEXT_PUBLIC_ORDER_SERVICE_URL
              valueFrom:
                secretKeyRef:
                  name: next-app-secret
                  key: NEXT_PUBLIC_ORDER_SERVICE_URL
            - name: NEXT_PUBLIC_PAYMENT_SERVICE_URL
              valueFrom:
                secretKeyRef:
                  name: next-app-secret
                  key: NEXT_PUBLIC_PAYMENT_SERVICE_URL
            - name: NEXT_PUBLIC_AUTH_SERVICE_URL
              valueFrom:
                secretKeyRef:
                  name: next-app-secret
                  key: NEXT_PUBLIC_AUTH_SERVICE_URL

            - name: NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME
              valueFrom:
                secretKeyRef:
                  name: next-app-secret
                  key: NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME

            - name: NODE_ENV
              value: "production"

---
apiVersion: v1
kind: Service
metadata:
  name: admin
  namespace: microservices
  labels:
    app: admin
spec:
  type: ClusterIP
  selector:
    app: admin
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
