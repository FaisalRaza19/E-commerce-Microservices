name: Build & Push to ECR

on:
  push:
    branches:
      - main

env:
  IMAGE_TAG: 1.0.${{ github.run_number }}
  TURBO_BASE: ${{ github.sha }}

jobs:
  determine_changes:
    runs-on: ubuntu-latest
    outputs:
      services_to_deploy: ${{ steps.changes.outputs.apps_to_deploy }}

    steps:
      - name: Checkout Code (Full History)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔨 Get Changed Services
        id: changes
        run: |
          # The list of all your apps
          ALL_APPS="product-service,auth-service,order-service,payment-service,email-service,client,Admin"

          # Find apps affected since the last successful push (HEAD^ is a good proxy)
          CHANGED_APPS=$(npx turbo affected --only=app --json --output-type=stream --since=HEAD^ --filter="{${ALL_APPS}}" | jq -r '.[].workspaceName' | tr '\n' ' ')

          # Convert the space-separated list into a GHA JSON array format
          JSON_ARRAY="[$(echo $CHANGED_APPS | tr ' ' ',' | sed 's/,*$//g' | sed 's/^,//g' | sed 's/,/","/g' | sed 's/^/\"/g' | sed 's/$/\"/g' | sed 's/\"\"//g')]"

          if [ "$JSON_ARRAY" = '[""]' ]; then
            JSON_ARRAY="[]"
          fi

          echo "Services to Deploy: $JSON_ARRAY"
          echo "apps_to_deploy=$JSON_ARRAY" >> $GITHUB_OUTPUT

  build:
    needs: determine_changes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [product-service, auth-service, order-service, payment-service, email-service, client, Admin]

    if: contains(fromJSON(needs.determine_changes.outputs.services_to_deploy), matrix.service)

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # PRODUCT SERVICE
      - name: Build & Push Product Service
        run: |
          docker build -f apps/product-service/Dockerfile -t product-service .
          docker tag product-service:1.0 ${{ secrets.ECR_REGISTRY }}/product-service:1.0
          docker push ${{ secrets.ECR_REGISTRY }}/product-service:1.0

      # AUTH SERVICE
      - name: Build & Push Auth Service
        run: |
          docker build -f apps/auth-service/Dockerfile -t auth-service .
          docker tag auth-service:1.0 ${{ secrets.ECR_REGISTRY }}/auth-service:1.0
          docker push ${{ secrets.ECR_REGISTRY }}/auth-service:1.0

      # ORDER SERVICE
      - name: Build & Push Order Service
        run: |
          docker build -f apps/order-service/Dockerfile -t order-service .
          docker tag order-service:1.0 ${{ secrets.ECR_REGISTRY }}/order-service:1.0
          docker push ${{ secrets.ECR_REGISTRY }}/order-service:1.0

      # PAYMENT SERVICE
      - name: Build & Push Payment Service
        run: |
          docker build -f apps/payment-service/Dockerfile -t payment-service .
          docker tag payment-service:1.0 ${{ secrets.ECR_REGISTRY }}/payment-service:1.0
          docker push ${{ secrets.ECR_REGISTRY }}/payment-service:1.0

      # EMAIL SERVICE
      - name: Build & Push Email Service
        run: |
          docker build -f apps/email-service/Dockerfile -t email-service .
          docker tag email-service:1.0 ${{ secrets.ECR_REGISTRY }}/email-service:1.0
          docker push ${{ secrets.ECR_REGISTRY }}/email-service:1.0

      # CLIENT APP
      - name: Build & Push Client App
        run: |
          docker build -f apps/client/Dockerfile -t client .
          docker tag client:1.0 ${{ secrets.ECR_REGISTRY }}/client:1.0
          docker push ${{ secrets.ECR_REGISTRY }}/client:1.0

      # ADMIN APP
      - name: Build & Push Admin App
        run: |
          docker build -f apps/Admin/Dockerfile -t admin .
          docker tag admin:1.0 ${{ secrets.ECR_REGISTRY }}/admin:1.0
          docker push ${{ secrets.ECR_REGISTRY }}/admin:1.0
