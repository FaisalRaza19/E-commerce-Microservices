name: CI/CD Build Image to ECR

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Enter image version/tag (optional, e.g., v1.0.0). If empty, a SHA tag is used."
        required: false
      build_all:
        description: "Set to 'true' to force building ALL service images."
        type: boolean
        default: false
  push:
    branches:
      - main
    paths-ignore:
      - "k8s/**"

concurrency:
  group: ci-cd-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    env:
      ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      ALL_SERVICES: "client admin product-service auth-service order-service payment-service email-service"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history is required for git diff

      - name: Set VERSION and TAG_LATEST
        id: set_version
        run: |
          VERSION_INPUT="${{ github.event.inputs.version }}"
          VERSION_TAG=""
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ -n "$VERSION_INPUT" ]; then
            VERSION_TAG="$VERSION_INPUT"
          else
            VERSION_TAG="sha-$(git rev-parse --short HEAD)"
          fi
          echo "VERSION=$VERSION_TAG" >> $GITHUB_ENV

          TAG_LATEST=false
          if [ "${{ github.event.inputs.build_all }}" = "true" ]; then
              TAG_LATEST=true
          fi
          echo "TAG_LATEST=$TAG_LATEST" >> $GITHUB_ENV
          echo "VERSION_TAG: $VERSION_TAG"

      - name: Detect changed services
        id: detect
        run: |
          set -euxo pipefail
          ALL_SERVICES_LIST="${{ env.ALL_SERVICES }}"
          BASE_COMMIT=""
          CHANGED_FILES=""

          # Ensure origin/main exists
          git fetch origin main

          if git rev-parse --verify origin/main >/dev/null 2>&1; then
            BASE_COMMIT=$(git merge-base origin/main HEAD)
            CHANGED_FILES=$(git diff --name-only "$BASE_COMMIT" HEAD)
          fi

          SERVICES_TO_BUILD=""

          # Full build if build_all=true or initial push
          if [ -z "$BASE_COMMIT" ] || [ "${{ github.event.inputs.build_all }}" = "true" ]; then
            SERVICES_TO_BUILD="$ALL_SERVICES_LIST"
            echo "TAG_LATEST=true" >> $GITHUB_ENV
          else
            for SVC_NAME in $ALL_SERVICES_LIST; do
              case "$SVC_NAME" in
                client) FOLDER="apps/client";;
                admin) FOLDER="apps/Admin";;
                product-service) FOLDER="apps/product-service";;
                auth-service) FOLDER="apps/auth-service";;
                order-service) FOLDER="apps/order-service";;
                payment-service) FOLDER="apps/payment-service";;
                email-service) FOLDER="apps/email-service";;
                *) continue;;
              esac

              if echo "$CHANGED_FILES" | grep -qE "^$FOLDER/"; then
                SERVICES_TO_BUILD="$SERVICES_TO_BUILD $SVC_NAME"
              fi
            done
          fi

          SERVICES_TO_BUILD=$(echo $SERVICES_TO_BUILD | xargs)
          echo "services=$SERVICES_TO_BUILD" >> $GITHUB_OUTPUT
          echo "Detected services to build: $SERVICES_TO_BUILD"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push Docker Images
        if: steps.detect.outputs.services != ''
        run: |
          set -euxo pipefail
          VERSION=${{ env.VERSION }}
          REGISTRY=${ECR_REGISTRY}
          SERVICES="${{ steps.detect.outputs.services }}"
          SHOULD_TAG_LATEST="${{ env.TAG_LATEST }}"

          for S in $SERVICES; do
            case "$S" in
              client) DOCKERFILE="apps/client/Dockerfile";;
              admin) DOCKERFILE="apps/Admin/Dockerfile";;
              product-service) DOCKERFILE="apps/product-service/Dockerfile";;
              auth-service) DOCKERFILE="apps/auth-service/Dockerfile";;
              order-service) DOCKERFILE="apps/order-service/Dockerfile";;
              payment-service) DOCKERFILE="apps/payment-service/Dockerfile";;
              email-service) DOCKERFILE="apps/email-service/Dockerfile";;
              *) continue;;
            esac

            VERSION_IMAGE="$REGISTRY/$S:$VERSION"

            echo "🚀 Building service: $S"
            echo "   Dockerfile: $DOCKERFILE"
            echo "   Tag: $VERSION"

            docker build -f "$DOCKERFILE" -t "$S:$VERSION" .
            docker tag "$S:$VERSION" "$VERSION_IMAGE"
            docker push "$VERSION_IMAGE"

            if [ "$SHOULD_TAG_LATEST" = "true" ]; then
              LATEST_IMAGE="$REGISTRY/$S:latest"
              docker tag "$S:$VERSION" "$LATEST_IMAGE"
              docker push "$LATEST_IMAGE"
            fi

            echo "✅ Build and Push for $S completed."
          done

      - name: Done
        run: echo "🎉 CI/CD pipeline completed successfully!"
