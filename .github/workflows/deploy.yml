name: CI/CD Deploy to EKS

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Enter image version/tag (optional, e.g., v1.0.0). Leave blank to use commit SHA"
        required: false
  push:
    branches:
      - main

concurrency:
  group: ci-cd-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}
      K8S_NAMESPACE: ${{ secrets.K8S_NAMESPACE || 'microservices' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set VERSION variable
        run: |
          VERSION_INPUT="${{ github.event.inputs.version }}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ -n "$VERSION_INPUT" ]; then
            echo "VERSION=$VERSION_INPUT" >> $GITHUB_ENV
          else
            echo "VERSION=sha-$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          fi

      - name: Detect changed services or full build
        id: detect
        run: |
          set -euxo pipefail
          git fetch origin main || true
          if git rev-parse --verify origin/main >/dev/null 2>&1; then
            BASE=$(git merge-base origin/main HEAD || true)
            CHANGED=$(git diff --name-only "$BASE" HEAD || true)
          else
            CHANGED="ALL"
          fi

          SERVICES=""
          if [ "$CHANGED" = "ALL" ] || [ -z "$CHANGED" ]; then
            SERVICES="client admin product-service auth-service order-service payment-service email-service"
          else
            for FOLDER in apps/client apps/Admin apps/product-service apps/auth-service apps/order-service apps/payment-service apps/email-service; do
              if echo "$CHANGED" | grep -qE "^$FOLDER/"; then
                SVC=$(basename "$FOLDER")
                [[ "$SVC" == "Admin" ]] && SVC="admin"
                SERVICES="$SERVICES $SVC"
              fi
            done
          fi
          SERVICES=$(echo $SERVICES | xargs)
          echo "services=$SERVICES" >> $GITHUB_OUTPUT
          echo "Detected services to build: $SERVICES"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push Docker Images
        if: steps.detect.outputs.services != ''
        run: |
          set -euxo pipefail
          VERSION=${{ env.VERSION }}
          REGISTRY=${ECR_REGISTRY}
          SERVICES="${{ steps.detect.outputs.services }}"

          for S in $SERVICES; do
            case "$S" in
              client) DOCKERFILE="apps/client/Dockerfile";;
              admin) DOCKERFILE="apps/Admin/Dockerfile";;
              product-service) DOCKERFILE="apps/product-service/Dockerfile";;
              auth-service) DOCKERFILE="apps/auth-service/Dockerfile";;
              order-service) DOCKERFILE="apps/order-service/Dockerfile";;
              payment-service) DOCKERFILE="apps/payment-service/Dockerfile";;
              email-service) DOCKERFILE="apps/email-service/Dockerfile";;
              *) continue;;
            esac

            IMAGE="$REGISTRY/$S:$VERSION"
            echo "Building $S -> $IMAGE"

            docker build -f "$DOCKERFILE" -t "$S:$VERSION" .
            docker tag "$S:$VERSION" "$IMAGE"
            docker push "$IMAGE"
          done

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "latest"

      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig --name ${{ secrets.EKS_CLUSTER_NAME }} --region ${{ secrets.AWS_REGION }}
          kubectl config current-context

      - name: Deploy to EKS
        if: steps.detect.outputs.services != ''
        run: |
          set -euxo pipefail
          VERSION=${{ env.VERSION }}
          REGISTRY=${ECR_REGISTRY}
          NAMESPACE=${{ env.K8S_NAMESPACE }}

          echo "🚀 Applying base Kubernetes manifests..."
          kubectl apply -f k8s/ -n "$NAMESPACE"

          for S in ${{ steps.detect.outputs.services }}; do
            IMAGE="$REGISTRY/$S:$VERSION"
            echo "🔄 Updating deployment $S -> $IMAGE"
            kubectl -n "$NAMESPACE" set image deployment/$S $S="$IMAGE"
            kubectl -n "$NAMESPACE" rollout status deployment/$S --timeout=180s
          done

      - name: Done
        run: echo "🎉 CI/CD pipeline completed successfully!"
