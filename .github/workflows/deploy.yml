name: Selective Build & Push to ECR

on:
  push:
    branches:
      - main

env:
  IMAGE_TAG: 1.${{ github.run_number }}

jobs:
  determine_changes:
    runs-on: ubuntu-latest
    outputs:
      services_to_deploy: ${{ steps.changes.outputs.apps_to_deploy }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Setup Node and install dependencies to run npx turbo
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install Monorepo Dependencies
        run: npm install

      - name: 🔨 Get Changed Services
        id: changes
        run: |
          # The list of all your apps
          ALL_APPS="product-service,auth-service,order-service,payment-service,email-service,client,Admin"

          # Find apps affected since the last successful push (HEAD^ is a good proxy)
          CHANGED_APPS=$(npx turbo affected --only=app --json --output-type=stream --since=HEAD^ --filter="{${ALL_APPS}}" | jq -r '.[].workspaceName' | tr '\n' ' ')

          # Convert to JSON array for GHA output
          JSON_ARRAY="[$(echo $CHANGED_APPS | tr ' ' ',' | sed 's/,*$//g' | sed 's/^,//g' | sed 's/,/","/g' | sed 's/^/\"/g' | sed 's/$/\"/g' | sed 's/\"\"//g')]"

          if [ "$JSON_ARRAY" = '[""]' ]; then
            JSON_ARRAY="[]"
          fi

          echo "Services to Deploy: $JSON_ARRAY"
          echo "apps_to_deploy=$JSON_ARRAY" >> $GITHUB_OUTPUT

  # 2. Build and Push (Runs one parallel job for each changed service)
  build_and_push_service:
    needs: determine_changes
    runs-on: ubuntu-latest

    if: needs.determine_changes.outputs.services_to_deploy != '[]'
    strategy:
      # Dynamically create a job matrix using the list of changed services
      matrix:
        service: ${{ fromJSON(needs.determine_changes.outputs.services_to_deploy) }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Configure AWS Credentials (Needed for ECR login)
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # build and push service
      - name: Build & Push ${{ matrix.service }}
        run: |
          SERVICE_NAME="${{ matrix.service }}"

          # Determine Dockerfile Path (Handles 'Admin' capital letter)
          DOCKERFILE_PATH="apps/$SERVICE_NAME/Dockerfile"

          FINAL_IMAGE="${{ secrets.ECR_REGISTRY }}/$SERVICE_NAME:${{ env.IMAGE_TAG }}"

          echo "--- Building $SERVICE_NAME with version tag: ${{ env.IMAGE_TAG }} ---"

          # 1. Build using a temporary tag specific to the service
          # Using the correct Dockerfile path determined above
          docker build -f $DOCKERFILE_PATH -t $SERVICE_NAME:build-temp .

          # 2. Tag with the specific version number
          docker tag $SERVICE_NAME:build-temp $FINAL_IMAGE

          # 3. Push the versioned tag to ECR
          docker push $FINAL_IMAGE

          echo "Successfully pushed $FINAL_IMAGE to ECR."
