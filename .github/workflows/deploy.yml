name: Deploy Microservices

on:
  push:
    branches: ["main"]
    paths:
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:
    inputs:
      force_build_all:
        description: "Force build ALL services regardless of changes?"
        required: true
        default: false
        type: boolean

env:
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
  AWS_REGION: ${{ secrets.AWS_REGION }}
  IMAGE_TAG: 1.0.${{ github.run_number }}

  # --- FRONTEND BUILD VARIABLES ---
  NEXT_PUBLIC_PRODUCT_SERVICE_URL: "https://trendlama-client.duckdns.org/api/products"
  NEXT_PUBLIC_ORDER_SERVICE_URL: "https://trendlama-client.duckdns.org/api/orders"
  NEXT_PUBLIC_PAYMENT_SERVICE_URL: "https://trendlama-client.duckdns.org/api/payments"
  NEXT_PUBLIC_AUTH_SERVICE_URL: "https://trendlama-client.duckdns.org/api/auth"

  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_ZWxlY3RyaWMtZWxlcGhhbnQtNzIuY2xlcmsuYWNjb3VudHMuZGV2JA"
  NEXT_PUBLIC_CLERK_SIGN_IN_URL: "/sign-in"
  NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL: "/"
  NEXT_PUBLIC_CLERK_SIGN_UP_URL: "/sign-up"
  NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL: "/"

  NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: "faisalraza"

permissions:
  id-token: write
  contents: read

jobs:
  # JOB 1: Detect which folders changed
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      admin: ${{ steps.filter.outputs.admin }}
      client: ${{ steps.filter.outputs.client }}
      auth: ${{ steps.filter.outputs.auth }}
      email: ${{ steps.filter.outputs.email }}
      order: ${{ steps.filter.outputs.order }}
      payment: ${{ steps.filter.outputs.payment }}
      product: ${{ steps.filter.outputs.product }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            admin:
              - 'apps/Admin/**'
              - 'packages/**'
            client:
              - 'apps/client/**'
              - 'packages/**'
            auth:
              - 'apps/auth-service/**'
              - 'packages/**'
            email:
              - 'apps/email-service/**'
              - 'packages/**'
            order:
              - 'apps/order-service/**'
              - 'packages/**'
            payment:
              - 'apps/payment-service/**'
              - 'packages/**'
            product:
              - 'apps/product-service/**'
              - 'packages/**'

  # JOB 2: Build and Push Images
  build-and-push:
    needs: detect-changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: admin
            context: apps/Admin
            ecr_repo: admin 
            port: 3001
          - service: client
            context: apps/client
            ecr_repo: client
            port: 3000
          - service: auth
            context: apps/auth-service
            ecr_repo: auth-service
            port: 8003
          - service: email
            context: apps/email-service
            ecr_repo: email-service
            port: 8004
          - service: order
            context: apps/order-service
            ecr_repo: order-service
            port: 8001
          - service: payment
            context: apps/payment-service
            ecr_repo: payment-service
            port: 8002
          - service: product
            context: apps/product-service
            ecr_repo: product-service
            port: 8000

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Logic: Run build if (Changed == 'true') OR (Force Build == 'true')
      - name: Should Build?
        id: check
        run: |
          if [[ "${{ needs.detect-changes.outputs[matrix.service] }}" == "true" ]] || [[ "${{ inputs.force_build_all }}" == "true" ]]; then
            echo "build=true" >> $GITHUB_OUTPUT
          else
            echo "build=false" >> $GITHUB_OUTPUT
          fi

      - name: Configure AWS Credentials
        if: steps.check.outputs.build == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: steps.check.outputs.build == 'true'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        if: steps.check.outputs.build == 'true'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ matrix.ecr_repo }}
        run: |
          # Build using the specific Dockerfile inside the apps folder, but context is Root (.)
          docker build \
            --build-arg NEXT_PUBLIC_PRODUCT_SERVICE_URL="${{ env.NEXT_PUBLIC_PRODUCT_SERVICE_URL }}" \
            --build-arg NEXT_PUBLIC_ORDER_SERVICE_URL="${{ env.NEXT_PUBLIC_ORDER_SERVICE_URL }}" \
            --build-arg NEXT_PUBLIC_PAYMENT_SERVICE_URL="${{ env.NEXT_PUBLIC_PAYMENT_SERVICE_URL }}" \
            --build-arg NEXT_PUBLIC_AUTH_SERVICE_URL="${{ env.NEXT_PUBLIC_AUTH_SERVICE_URL }}" \
            --build-arg NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY="${{ env.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}" \
            --build-arg NEXT_PUBLIC_CLERK_SIGN_IN_URL="${{ env.NEXT_PUBLIC_CLERK_SIGN_IN_URL }}" \
            --build-arg NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL="${{ env.NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL }}" \
            --build-arg NEXT_PUBLIC_CLERK_SIGN_UP_URL="${{ env.NEXT_PUBLIC_CLERK_SIGN_UP_URL }}" \
            --build-arg NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL="${{ env.NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL }}" \
            --build-arg NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME="${{ env.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME }}" \
            -f ${{ matrix.context }}/Dockerfile \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            .
          
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          
          echo "::notice::Pushed $ECR_REPOSITORY:$IMAGE_TAG"